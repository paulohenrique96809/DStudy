<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/styles.css">
    <title>DStudy - P05</title>
</head>
<body>
    <div class="container">
        <!-- HEADER -->
        <header class="header">
            <h1>📚 DStudy</h1>
            <p>Sistema de estudos com flashcards - TCC</p>
            <span class="badge">P05 - Seleção de matéria</span>
        </header>

        <!-- TELA DE MATÉRIAS -->
        <div id="tela-materias" class="tela ativa">
            <div id="materias-container">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>Carregando matérias...</p>
                </div>
            </div>
            <div id="progresso-container">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>Carregando progresso...</p>
                </div>
            </div>
        </div>

        <!-- TELA DE ESTUDO -->
        <div id="tela-estudo" class="tela">
            <div style="text-align: center; margin-bottom: 20px;">
                <span style="font-size: 14px; color: #666;">📚 Estudo</span>
            </div>
            <div id="estudo-info"></div>
            <div id="estudo-container">
                <p class="empty-state">Selecione uma matéria para começar</p>
            </div>
            <div id="flashcard-container"></div>
            <div style="text-align: center; font-size: 13px; color: #999; padding: 20px; border-top: 1px solid #eee; margin-top: 20px;">
                <span>⬅️ Use o botão de voltar do navegador para retornar</span>
            </div>
        </div>
    </div>

    <!-- ===== CARREGA O JAVASCRIPT ===== -->
    <script type="module">
        import app from './js/main.js';
        window.app = app;
        console.log('✅ App carregado!');
        console.log('💡 Digite "app" no console para interagir');
    </script>
</body>
</html>
