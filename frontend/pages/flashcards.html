<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DStudy — Flashcards</title>

    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/flashcards.css">
</head>
<body>

    <!-- ==============================
         FUNDO DECORATIVO (BOLHAS)
         19 bolhas: 8 pequenas, 8 médias, 3 grandes
         ============================== -->
    <div class="bolhas" aria-hidden="true">
        <!-- Pequenas -->
        <img src="../assets/img/bolhapequena.png" alt="" class="bolha bolhapequena bolha-1">
        <img src="../assets/img/bolhapequena.png" alt="" class="bolha bolhapequena bolha-2">
        <img src="../assets/img/bolhapequena.png" alt="" class="bolha bolhapequena bolha-3">
        <img src="../assets/img/bolhapequena.png" alt="" class="bolha bolhapequena bolha-4">
        <img src="../assets/img/bolhapequena.png" alt="" class="bolha bolhapequena bolha-5">
        <img src="../assets/img/bolhapequena.png" alt="" class="bolha bolhapequena bolha-6">
        <img src="../assets/img/bolhapequena.png" alt="" class="bolha bolhapequena bolha-7">
        <img src="../assets/img/bolhapequena.png" alt="" class="bolha bolhapequena bolha-8">

        <!-- Médias -->
        <img src="../assets/img/bolhamedia.png" alt="" class="bolha bolhamedia bolha-9">
        <img src="../assets/img/bolhamedia.png" alt="" class="bolha bolhamedia bolha-10">
        <img src="../assets/img/bolhamedia.png" alt="" class="bolha bolhamedia bolha-11">
        <img src="../assets/img/bolhamedia.png" alt="" class="bolha bolhamedia bolha-12">
        <img src="../assets/img/bolhamedia.png" alt="" class="bolha bolhamedia bolha-13">
        <img src="../assets/img/bolhamedia.png" alt="" class="bolha bolhamedia bolha-14">
        <img src="../assets/img/bolhamedia.png" alt="" class="bolha bolhamedia bolha-15">
        <img src="../assets/img/bolhamedia.png" alt="" class="bolha bolhamedia bolha-16">

        <!-- Grandes -->
        <img src="../assets/img/bolhagrande.png" alt="" class="bolha bolhagrande bolha-17">
        <img src="../assets/img/bolhagrande.png" alt="" class="bolha bolhagrande bolha-18">
        <img src="../assets/img/bolhagrande.png" alt="" class="bolha bolhagrande bolha-19">
    </div>

    <!-- ==============================
         LOGO (centralizada)
         ============================== -->
    <header class="topo">
        <div class="logo-container">
            <img src="../assets/img/logo.png" alt="Caveirinha DStudy" class="logo-icone">
            <span class="logo-texto">DStudy</span>
        </div>
    </header>

    <!-- ==============================
         CONTEÚDO PRINCIPAL
         ============================== -->
    <main class="flashcards-conteudo">

        <!-- Caixa da pergunta -->
        <section class="cartao-pergunta">
            <span class="tag-materia" id="tag-materia">Redes e Segurança</span>
            <h1 class="pergunta" id="pergunta">Qual é a função da criptografia na segurança da informação?</h1>
        </section>

        <!-- Contador -->
        <p class="contador" id="contador">Card X de XX</p>

        <!-- Alternativas (o Paulo preenche o texto e aplica as classes de estado) -->
        <div class="alternativas" id="alternativas" role="group" aria-label="Alternativas">
            <button type="button" class="alternativa" data-letra="A">
                <span class="alt-letra">A)</span>
                <span class="alt-texto">Transformar os dados em um formato ilegível para quem não tem a chave</span>
            </button>
            <button type="button" class="alternativa" data-letra="B">
                <span class="alt-letra">B)</span>
                <span class="alt-texto">Apagar os dados antigos automaticamente</span>
            </button>
            <button type="button" class="alternativa" data-letra="C">
                <span class="alt-letra">C)</span>
                <span class="alt-texto">Aumentar a velocidade de transferência de arquivos</span>
            </button>
            <button type="button" class="alternativa" data-letra="D">
                <span class="alt-letra">D)</span>
                <span class="alt-texto">Impedir que o computador seja ligado</span>
            </button>
        </div>

        <!-- Próximo: escondido até o Paulo aplicar a classe "visivel" -->
        <button type="button" class="btn-proxima" id="btn-proxima">Próximo</button>

    </main>

    <!-- RODAPÉ -->
    <footer class="rodape-areia">
        <img src="../assets/img/fundo.png" alt="Cenário de areia e plantas" class="img-rodape">
    </footer>

    <script type="module" src="../js/pages/flashcards.js"></script>

</body>
</html>
